<div class="bg-info p-2 text-center text-white">
  <h3>SportStore Admin</h3>
  <div class="bg-danger mt-2 p-2 text-center text-white" *ngIf="errorMessage != null">
    {{ errorMessage }}
  </div>
  <div class="p-2">
    <form action="" novalidate #form="ngForm" (ngSubmit)="authenticate(form)">
      <div class="form-group">
        <label for="">Name</label
        ><input type="text" class="form-control" name="username" [(ngModel)]="username" required />
      </div>
      <div class="form-group">
        <label for="">Password</label
        ><input
          type="password"
          class="form-control"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>
      <div class="text-center">
        <button class="btn btn-primary m-1" routerLink="/">Go Back</button>
        <button type="submit" class="btn btn-primary m-1">Log In</button>
      </div>
    </form>
  </div>
</div>
